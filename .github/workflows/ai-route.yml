# [FORK] Pick a model route for tier-2 triage, or conclude there isn't one.
#
# Reusable: call it and read `route`, `runner` and `detail`. See _docs/ai-triage-routes.md.
#
# The routes, in order of preference:
#   hiro       self-hosted runner on the home server -> hiro-bridge on 127.0.0.1:8130
#              Real `claude` processes via the Agent SDK, so included Max usage rather than the
#              metered pool. Reachable only from that box, which is why the runner goes to the
#              bridge instead of the bridge being exposed.
#   omniroute  same box, self-hosted gateway on 127.0.0.1:20128
#              The fallback for when hiro's quota policy stops autonomous work, which it does at
#              90% of included headroom by design. Being refused is normal, not an incident.
#   anthropic  cloud runner, ANTHROPIC_API_KEY
#              Works when the house is dark. Spends real money, so it sits last.
#   none       no route available. A valid outcome: the caller still has the deterministic
#              merge-risk report and the gate suites, which never depended on a model.
#
# Everything here probes rather than assumes. hiro's own tracker still lists the included-usage
# confirmation as blocked, and a service that is installed is not necessarily a service that is
# running.
#
# Why runner liveness is checked through the API first: a job pinned to an offline self-hosted runner
# **queues** rather than failing, and `timeout-minutes` does not help because that clock only starts
# once the job starts. Selecting the target up front is what keeps a powered-off server from parking
# the whole workflow for a day.

name: AI route

on:
  workflow_call:
    outputs:
      route:
        description: hiro | omniroute | anthropic | none
        value: ${{ jobs.decide.outputs.route }}
      runner:
        description: The runs-on value the chosen route needs.
        value: ${{ jobs.decide.outputs.runner }}
      detail:
        description: One line on why this route was chosen, for the PR body.
        value: ${{ jobs.decide.outputs.detail }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  select:
    name: Look for a self-hosted runner
    if: ${{ github.repository != 'immich-app/immich' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      self_hosted: ${{ steps.look.outputs.self_hosted }}
      runner: ${{ steps.look.outputs.runner }}
      reason: ${{ steps.look.outputs.reason }}
    steps:
      - name: Query runner status
        id: look
        env:
          # Listing self-hosted runners needs repo administration scope, which GITHUB_TOKEN cannot be
          # granted. So this is an optional fine-grained PAT with administration:read. Absent, the
          # workflow degrades to the cloud routes rather than failing, which is the right default: a
          # missing secret should never be able to hang a job behind a dead runner.
          GH_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
          LABEL: hiro
        run: |
          set -uo pipefail

          emit() {
            echo "self_hosted=$1" >> "$GITHUB_OUTPUT"
            echo "runner=$2" >> "$GITHUB_OUTPUT"
            echo "reason=$3" >> "$GITHUB_OUTPUT"
            echo "$3"
          }

          if [ -z "${GH_TOKEN:-}" ]; then
            emit false ubuntu-latest "No RUNNER_STATUS_TOKEN secret, so runner status is unknown; treating the self-hosted routes as unavailable."
            exit 0
          fi

          if ! runners=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runners" --paginate 2>/dev/null); then
            emit false ubuntu-latest "Could not list runners (token lacks administration:read, or the API failed); treating the self-hosted routes as unavailable."
            exit 0
          fi

          online=$(echo "$runners" | jq -r --arg l "$LABEL" \
            '[.runners[]? | select(.status == "online" and ([.labels[].name] | index($l)))] | length')

          if [ "${online:-0}" -gt 0 ]; then
            emit true "self-hosted" "Found $online online runner(s) labelled '$LABEL'."
          else
            emit false ubuntu-latest "No online runner labelled '$LABEL'; the server is probably off."
          fi

  probe:
    name: Probe the local gateways
    needs: select
    if: ${{ github.repository != 'immich-app/immich' && needs.select.outputs.self_hosted == 'true' }}
    runs-on: ${{ needs.select.outputs.runner }}
    timeout-minutes: 5
    # A wedged runner must not take the caller down with it: this job failing simply means the local
    # routes are unavailable, which `decide` handles.
    continue-on-error: true
    outputs:
      hiro: ${{ steps.probe.outputs.hiro }}
      omniroute: ${{ steps.probe.outputs.omniroute }}
    steps:
      - name: Curl each gateway
        id: probe
        run: |
          set -uo pipefail

          # Any answer at all counts as alive, including 401 or 404: this is a liveness check, not an
          # auth check. A closed port gives 000, which is the case being distinguished.
          check() {
            code=$(curl -s -o /dev/null -m 5 -w '%{http_code}' "$1" || echo 000)
            echo "$code"
          }

          hiro_code=$(check http://127.0.0.1:8130/v1/models)
          omni_code=$(check http://127.0.0.1:20128/v1/models)
          echo "hiro-bridge  http=$hiro_code"
          echo "omniroute    http=$omni_code"

          [ "$hiro_code" != "000" ] && echo "hiro=true" >> "$GITHUB_OUTPUT" || echo "hiro=false" >> "$GITHUB_OUTPUT"
          [ "$omni_code" != "000" ] && echo "omniroute=true" >> "$GITHUB_OUTPUT" || echo "omniroute=false" >> "$GITHUB_OUTPUT"

  decide:
    name: Decide
    needs: [select, probe]
    if: ${{ always() && github.repository != 'immich-app/immich' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      route: ${{ steps.decide.outputs.route }}
      runner: ${{ steps.decide.outputs.runner }}
      detail: ${{ steps.decide.outputs.detail }}
    steps:
      - name: Choose
        id: decide
        env:
          SELF_HOSTED: ${{ needs.select.outputs.self_hosted }}
          SELECT_REASON: ${{ needs.select.outputs.reason }}
          HIRO: ${{ needs.probe.outputs.hiro }}
          OMNIROUTE: ${{ needs.probe.outputs.omniroute }}
          HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          set -uo pipefail

          choose() {
            echo "route=$1" >> "$GITHUB_OUTPUT"
            echo "runner=$2" >> "$GITHUB_OUTPUT"
            echo "detail=$3" >> "$GITHUB_OUTPUT"
            echo "route=$1 runner=$2"
            echo "$3"
          }

          if [ "$SELF_HOSTED" = 'true' ] && [ "${HIRO:-false}" = 'true' ]; then
            choose hiro "self-hosted" "hiro-bridge answered on 127.0.0.1:8130. Included Max usage via real claude processes; hiro's quota policy can still refuse an autonomous turn, in which case the caller should re-run and land on omniroute."
            exit 0
          fi

          if [ "$SELF_HOSTED" = 'true' ] && [ "${OMNIROUTE:-false}" = 'true' ]; then
            choose omniroute "self-hosted" "hiro-bridge did not answer; OmniRoute did, on 127.0.0.1:20128."
            exit 0
          fi

          if [ "$HAS_ANTHROPIC_KEY" = 'true' ]; then
            choose anthropic ubuntu-latest "No local gateway available ($SELECT_REASON) so falling back to the metered Anthropic API, which costs money."
            exit 0
          fi

          choose none ubuntu-latest "No model route available ($SELECT_REASON) and no ANTHROPIC_API_KEY secret. The deterministic merge-risk report and the gate suites are unaffected."
