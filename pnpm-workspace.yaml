packages:
  - packages/**
  - docs
  - e2e
  - i18n
  - server
  - plugins
  - web
  - .github
  - packages/*
allowBuilds:
  '@nestjs/core': false
  '@parcel/watcher': false
  '@scarf/scarf': false
  '@swc/core': false
  bcrypt: true
  canvas: false
  core-js: false
  cpu-features: false
  es5-ext: false
  esbuild: false
  msgpackr-extract: false
  protobufjs: false
  sharp: true
  ssh2: false
  utimes: false
  '@tailwindcss/oxide': true
  core-js-pure: false
  postman-code-generators: false
overrides:
  canvas: 3.2.3
  sharp: ^0.35.3
packageExtensions:
  # The plugin does `import typescript from 'typescript'` and reads `SymbolFlags` off it, while
  # declaring `typescript` nowhere -- not a dependency, not a peer. So the import resolves to
  # whatever is hoisted, which in this workspace is the real `typescript@7` that `packages/sdk` and
  # the plugin packages depend on. TypeScript 7's entry point is `lib/version.cjs`, exporting only
  # `{ version, versionMajorMinor }`, so `SymbolFlags` is undefined and the rule throws
  # `Cannot read properties of undefined (reading 'Class')` on the first file it reaches instead of
  # reporting. `overrides` cannot fix an undeclared dependency; declaring it here can. The 6 alias is
  # what every linting workspace already uses and what the plugin is written against.
  '@koddsson/eslint-plugin-tscompat':
    dependencies:
      typescript: npm:@typescript/typescript6@^6.0.2
  nestjs-kysely:
    dependencies:
      tslib: '*'
  nestjs-otel:
    dependencies:
      tslib: '*'
  '@photo-sphere-viewer/equirectangular-video-adapter':
    dependencies:
      three: '*'
  '@photo-sphere-viewer/video-plugin':
    dependencies:
      three: '*'
  sharp:
    dependencies:
      node-addon-api: '*'
      node-gyp: '*'
  '@immich/ui':
    dependencies:
      tailwindcss: '>=4.1'
  tailwind-variants:
    dependencies:
      tailwindcss: '>=4.1'
  bcrypt:
    dependencies:
      node-addon-api: '*'
      node-gyp: '*'
  '@nestjs/swagger':
    peerDependencies:
      typescript: '*'
dedupePeerDependents: false
preferWorkspacePackages: true
injectWorkspacePackages: true
shamefullyHoist: false
verifyDepsBeforeRun: install
minimumReleaseAgeExclude:
  - '@immich/ui@0.83.0'
