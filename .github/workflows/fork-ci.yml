# [FORK] Gate suite for this fork's own branches.
#
# Upstream's workflows cannot run here: 18 of the 23 obtain a token through
# immich-app/devtools/actions/create-workflow-token, using PUSH_O_MATIC_APP_CLIENT_ID and
# PUSH_O_MATIC_APP_KEY, which are immich-app org secrets. They fail at the first step on a fork.
# So this is an added file rather than an edit to theirs, which also keeps .github/ from becoming a
# recurring merge conflict. Same approach as fork-build.yml in DjodyKort/cloudstream.
#
# Task names and setup mirror upstream's test.yml so the gates stay equivalent:
#   //server:ci-unit    install, plugins, format, lint, check, test
#   //server:ci-medium  install, plugins, plugin-core build, test-medium (Testcontainers)
#   //web:ci-unit       sdk install and build, install, format, check, test  (no lint, see below)
# The only substitution is the mise setup action, which has to be the public one.
#
# Deliberately omitted: machine-learning (this fork does not touch it, upstream covers it) and the
# e2e suites (they need a full docker compose stack; add later if the fork starts changing e2e).

name: Fork CI

on:
  push:
    branches: [integration]
  pull_request:
    branches: [integration]
  workflow_dispatch:
  # Callable so upstream-sync.yml can run these exact gates against its merge branch. A push made
  # with GITHUB_TOKEN does not trigger workflows, so a sync PR would otherwise sit ungated, which is
  # the one thing that must not happen. Calling the gates explicitly avoids both that gap and having
  # to keep a long-lived PAT around.
  workflow_call:
    inputs:
      ref:
        description: Ref to check out. Empty means the triggering ref, the default for push and pull_request.
        type: string
        required: false
        default: ''

concurrency:
  # The called ref is part of the group. Without it, a run invoked by upstream-sync would share a
  # group with the push-triggered run on integration, and cancel-in-progress would have the two
  # killing each other.
  group: fork-ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every job carries `if: github.repository != 'immich-app/immich'` so this file is inert if it ever
# reaches upstream. It is repeated per job rather than hoisted into `env`, because a job-level `if`
# cannot read the `env` context.
#
# The second half of that `if` is the duplicate-run guard. upstream-sync.yml calls this workflow
# against its merge branch and *then* opens the PR, and the PR open event triggers this workflow a
# second time -- the whole suite ran twice on every sync, ~19 job-minutes each. The `workflow_call`
# run is the one worth keeping: it gates the branch before the PR exists, and its result is what
# decides whether the PR opens as a draft.
#
# Scoped to the PR's author as well as the branch name, deliberately. A human opening a PR from a
# `sync/upstream-*` branch by hand is still gated; a bare branch-name check would silently stop doing
# that, which is the failure mode this file exists to avoid.
#
# `github.event.pull_request.user.login` rather than `github.actor`, for two reasons. `github.actor`
# is whoever caused the *latest* event, so pushing one commit to a sync branch would flip it to a
# human and quietly bring the duplicate run back. And zizmor flags an actor comparison as spoofable
# (bot-conditions), which for a condition that decides whether the gates run at all is not a warning
# to wave through. The PR's author is fixed for the life of the PR and comes from the event payload.
jobs:
  # Which areas this push actually touched, so the expensive jobs can sit out the pushes that cannot
  # affect them. Only `Mobile (build)` consults it today -- it is the long pole at ~4.5 min and 12 of
  # the last 20 commits here touched no mobile file at all.
  #
  # **Fails open.** Anything it cannot work out -- no base commit, a force push, a first push, a
  # workflow_call or dispatch with no diff to speak of -- reports every area as changed and everything
  # runs. A filter that wrongly skips a gate is worse than one that wrongly runs it, and this is the
  # side of that trade to be on.
  changes:
    name: Changed areas
    if: >-
      ${{ github.repository != 'immich-app/immich'
          && !(github.event_name == 'pull_request'
               && github.event.pull_request.user.login == 'github-actions[bot]'
               && startsWith(github.head_ref, 'sync/upstream-')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - id: filter
        env:
          # Empty for anything that is not a plain push or PR, which is what sends this fail-open.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'push' && github.event.before || '') }}
        run: |
          set -euo pipefail
          # 000... is what a push reports when the branch is new, and a force push can leave a base
          # that is no longer an ancestor. Both mean "no usable diff".
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]              || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no usable base ($BASE) - running everything"
            echo "mobile=true" >> "$GITHUB_OUTPUT"
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" HEAD)
          # shellcheck disable=SC2001  # indenting every line of a multi-line value; the parameter
          # expansion shellcheck suggests needs an embedded newline and is worse here.
          echo "$changed" | sed 's/^/  /'
          # Wider than just mobile/, on purpose. i18n feeds the generated translations, open-api
          # generates the Dart client, and the mise files pin the toolchain -- each can break the
          # build without touching mobile/. .github/ is in there so that editing this job re-runs it;
          # without that, a change to the build step could not verify itself.
          if echo "$changed" | grep -qE '^(mobile/|i18n/|open-api/|\.github/|mise\.toml|mise\.lock)'; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
          else
            echo "mobile=false" >> "$GITHUB_OUTPUT"
          fi
          # The API e2e suite exercises the running server through the SDK, so anything that changes
          # the server, the client it is driven by, or the compose stack it runs in can break it.
          if echo "$changed" | grep -qE '^(e2e/|server/|web/|packages/|open-api/|docker/|\.github/|mise\.toml|mise\.lock)'; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          fi

  # The gate on this file itself, and on the scripts around it. Nothing checked either until now:
  # upstream's `Zizmor` job only triggers on `pull_request` and `push: branches: [main]`, so a fork
  # that pushes straight to `integration` never ran it, and upstream's `ShellCheck` job dies on the
  # org token like the rest.
  #
  # This is not theoretical. `upstream-sync.yml` has a recorded `startup_failure` -- a workflow file
  # GitHub refused to start, found by pushing it -- and actionlint independently flags the two
  # `runs-on: mich` jobs that leave a run queued for 24 hours.
  #
  # Scoped to the fork's own workflow files on purpose. Upstream's are upstream's problem, they lint
  # them themselves, and most of them are disabled on this fork anyway; linting them here would mean a
  # red gate every time upstream edits a file we do not own.
  #
  # actionlint runs shellcheck over every `run:` block when shellcheck is on PATH, which it is on
  # ubuntu-latest. That is most of the value: the shell in these files is where the bugs live.
  workflows:
    name: Workflows (actionlint, zizmor, shellcheck)
    if: >-
      ${{ github.repository != 'immich-app/immich'
          && !(github.event_name == 'pull_request'
               && github.event.pull_request.user.login == 'github-actions[bot]'
               && startsWith(github.head_ref, 'sync/upstream-')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/fork-setup

      # Versions pinned inline rather than added to mise.toml, which is upstream's file. mise verifies
      # GitHub artifact attestations on these backends, which is a stronger guarantee than a
      # hand-written sha256 and does not have to be re-derived on a version bump.
      #
      # shellcheck comes from mise rather than from the runner image, even though ubuntu-latest ships
      # one. A lint gate that depends on what happens to be preinstalled is a gate that changes its
      # mind when GitHub rebuilds the image, and it would disagree with the local runner.
      - name: actionlint
        env:
          # mise resolves these releases through the GitHub API, and an unauthenticated runner shares
          # a 60-per-hour limit with every other job on the same egress IP. This fork has already lost
          # a run to exactly that failure mode once, on the anonymous ghcr.io pull in Server (medium),
          # where it surfaced as a 404 for a tag that plainly existed.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mise x aqua:koalaman/shellcheck@v0.11.0 github:rhysd/actionlint@1.7.12 -- \
            actionlint -color \
              .github/workflows/fork-ci.yml \
              .github/workflows/fork-release-mobile.yml \
              .github/workflows/upstream-sync.yml

      # --offline is deliberate. Online, zizmor resolves `uses:` refs against the API and runs audits
      # whose answers depend on the state of other repositories -- which makes the gate's verdict a
      # function of the network rather than of this commit, and makes it disagree with a local run.
      # Staleness of a pinned action is dependabot's job (.github/dependabot.yml), not this gate's.
      - name: zizmor
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mise x github:zizmorcore/zizmor@1.29.0 -- \
            zizmor --no-progress --offline --persona regular \
              .github/actions/fork-setup/action.yml \
              .github/workflows/fork-ci.yml \
              .github/workflows/fork-release-mobile.yml \
              .github/workflows/upstream-sync.yml

      - name: shellcheck
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise x aqua:koalaman/shellcheck@v0.11.0 -- shellcheck _fork/*.sh

  server:
    name: Server (unit, lint, format, check)
    if: >-
      ${{ github.repository != 'immich-app/immich'
          && !(github.event_name == 'pull_request'
               && github.event.pull_request.user.login == 'github-actions[bot]'
               && startsWith(github.head_ref, 'sync/upstream-')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Empty for push and pull_request, so checkout keeps its default behaviour there.
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/fork-setup
      - run: mise run ci-unit

  server-medium:
    name: Server (medium)
    if: >-
      ${{ github.repository != 'immich-app/immich'
          && !(github.event_name == 'pull_request'
               && github.event.pull_request.user.login == 'github-actions[bot]'
               && startsWith(github.head_ref, 'sync/upstream-')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # For the ghcr.io login below.
      packages: read
    defaults:
      run:
        working-directory: ./server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Empty for push and pull_request, so checkout keeps its default behaviour there.
          ref: ${{ inputs.ref }}
          # e2e/test-assets holds the video fixtures. Without it three medium tests fail on missing
          # files, which reads as a regression rather than a missing submodule.
          submodules: recursive
      - uses: ./.github/actions/fork-setup
      # Testcontainers otherwise pulls ghcr.io/immich-app/postgres anonymously, and anonymous pulls
      # are rate limited per IP across shared runners. Seen as a 404 "No such image", which then
      # cascades into a misleading "No test files found, exiting with code 1" once global setup dies.
      # It passed on the previous run with identical server code, so this is a pull limit rather than
      # a test problem. Authenticating with the run's own token raises the limit and costs nothing.
      # Both values go through the environment rather than being interpolated into the command. As
      # written before, `github.actor` was expanded into the shell by the runner before bash ever saw
      # it -- the pattern zizmor flags as template-injection. GitHub constrains usernames enough that
      # it was not exploitable, which is exactly why it would have survived indefinitely.
      - name: Log in to ghcr.io
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      # The login above was supposed to be the fix for that 404 and is not sufficient on its own: a
      # dispatch run hit it again while authenticated, for a tag that verifiably exists, one minute
      # into the job. Testcontainers pulls the image itself and gives up on the first failure, taking
      # the whole suite with it -- so a registry blip reads as a server test failure.
      #
      # Pulling here first, with backoff, turns that into a slower run instead of a red one. The tag
      # is read out of globalSetup.ts rather than repeated, so it cannot drift from the one the suite
      # actually asks for; if that grep ever stops matching, the step fails loudly rather than
      # silently pulling nothing.
      - name: Pre-pull the Postgres image
        run: |
          set -euo pipefail
          image=$(sed -n "s/.*new GenericContainer('\([^']*\)').*/\1/p" test/medium/globalSetup.ts)
          if [ -z "$image" ]; then
            echo "::error::could not read the Testcontainers image from test/medium/globalSetup.ts" && exit 1
          fi
          echo "pulling $image"
          for attempt in 1 2 3; do
            if docker pull "$image"; then exit 0; fi
            echo "::warning::pull failed (attempt $attempt of 3), retrying"
            sleep $((attempt * 15))
          done
          echo "::error::could not pull $image after 3 attempts" && exit 1
      - run: mise run ci-medium

  web:
    name: Web (unit, format, check)
    if: >-
      ${{ github.repository != 'immich-app/immich'
          && !(github.event_name == 'pull_request'
               && github.event.pull_request.user.login == 'github-actions[bot]'
               && startsWith(github.head_ref, 'sync/upstream-')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Empty for push and pull_request, so checkout keeps its default behaviour there.
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/fork-setup
      - run: mise run ci-unit

  web-lint:
    name: Web (lint)
    if: >-
      ${{ github.repository != 'immich-app/immich'
          && !(github.event_name == 'pull_request'
               && github.event.pull_request.user.login == 'github-actions[bot]'
               && startsWith(github.head_ref, 'sync/upstream-')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Empty for push and pull_request, so checkout keeps its default behaviour there.
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/fork-setup
      # Its own job on purpose. //web:ci-unit deliberately excludes lint, and upstream runs Lint Web
      # on their beefy self-hosted runner. It is the most resource-hungry gate here: under CPU
      # contention it dies with "Atomics.wait() failed: timed-out" inside synckit on the
      # better-tailwindcss rule, which is a load failure wearing a lint failure's clothes. Giving it
      # a dedicated runner is what keeps that from being misread.
      - run: mise run //:sdk:install && mise run //:sdk:build
      - run: mise run install
      - run: mise run lint

  # Prettier over the two directories nothing else covers. `.github` is in there because upstream's
  # own `.github Files Formatting` job cannot run on a fork, and a badly formatted workflow file is
  # exactly the sort of thing that arrives in a sync and never gets noticed.
  i18n:
    name: Formatting (i18n, .github)
    if: >-
      ${{ github.repository != 'immich-app/immich'
          && !(github.event_name == 'pull_request'
               && github.event.pull_request.user.login == 'github-actions[bot]'
               && startsWith(github.head_ref, 'sync/upstream-')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Empty for push and pull_request, so checkout keeps its default behaviour there.
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/fork-setup
      - run: mise run //:i18n:format
      # Not `mise run //.github:install`, which is upstream's task and does not work: it runs
      # `pnpm install --filter github`, and the package in .github has no `name` field, so pnpm
      # matches nothing -- and reports "No projects matched the filters" while exiting 0. The install
      # then appears to succeed and the format step dies on a missing prettier. Upstream's own job
      # does not use that task either.
      #
      # `--filter ./.github` is the path form, and it does match -- verified rather than assumed,
      # because "matches nothing and exits 0" is exactly the bug being worked around here. It also
      # beats upstream's own approach of installing from inside the directory, which pulls in all 12
      # workspace projects for a job that needs prettier.
      - run: pnpm install --frozen-lockfile --filter ./.github
      - run: mise run //.github:format

  openapi:
    name: OpenAPI (generated client is current)
    if: >-
      ${{ github.repository != 'immich-app/immich'
          && !(github.event_name == 'pull_request'
               && github.event.pull_request.user.login == 'github-actions[bot]'
               && startsWith(github.head_ref, 'sync/upstream-')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Empty for push and pull_request, so checkout keeps its default behaviour there.
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/fork-setup
      - run: mise run open-api
      # Regenerating must be a no-op: a diff here means a DTO or controller changed without the
      # client being regenerated. Note this is NOT what upstream's check-openapi.yml does - that one
      # diffs the spec against main for breaking changes and runs a Flutter patch-coverage test. This
      # gate is ours.
      #
      # Scoped to the generated artifacts on purpose. An unscoped `git diff` fails here for an
      # unrelated reason: running mise on Linux rewrites mise.lock and drops the macos-arm64 entries,
      # so the tree is dirty on every run regardless of the client. mobile/generated is gitignored.
      - name: Fail if the generated client is out of date
        run: |
          if ! git diff --exit-code -- open-api packages/sdk/src/fetch-client.ts; then
            echo "::error ::mise run open-api produced a diff. Run it locally and commit the result."
            exit 1
          fi

  # The cheap half of e2e, and the half this fork has already been bitten by: the commit that added
  # album-visibility.e2e-spec.ts also had to fix three fixtures and a deep-equal assertion that had
  # never learned about the fork's added DTO fields, all of which showed up as `//e2e:check` red.
  # Nothing ran that check. ci-unit is format + lint + tsc over e2e/src, and costs a couple of
  # minutes, so it is ungated.
  e2e-check:
    name: E2E (lint, format, check)
    if: >-
      ${{ github.repository != 'immich-app/immich'
          && !(github.event_name == 'pull_request'
               && github.event.pull_request.user.login == 'github-actions[bot]'
               && startsWith(github.head_ref, 'sync/upstream-')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/fork-setup
      - run: mise run ci-unit

  # The API suite, which stands up the real server in Docker and drives it through the SDK. This is
  # where album-visibility.e2e-spec.ts lives -- 189 lines written for this fork's features, and until
  # now never executed by anything. Upstream's own e2e jobs never covered it: test.yml triggers on
  # push to main plus pull_request, so an integration-branch fork inherits none of it.
  #
  # This file's header used to say e2e was left out and to "add later if the fork starts changing
  # e2e". The fork started; this is that.
  #
  # Gated on the changes filter because it is the most expensive job here by a distance -- it builds
  # the server image. Only the api and maintenance suites run: the Playwright web and ui projects
  # need browsers on top of the stack, and the fork has touched only their fixtures so far.
  e2e-api:
    name: E2E (API)
    needs: changes
    if: >-
      ${{ github.repository != 'immich-app/immich'
          && !(github.event_name == 'pull_request'
               && github.event.pull_request.user.login == 'github-actions[bot]'
               && startsWith(github.head_ref, 'sync/upstream-'))
          && needs.changes.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
          # The compose stack mounts test-assets; without it the media specs fail on missing files.
          submodules: recursive
      - uses: ./.github/actions/fork-setup
      # The same order upstream uses. The SDK has to be built before e2e installs, because the suite
      # imports it as a workspace package rather than talking to the API by hand.
      - name: Set up the SDK and CLI
        working-directory: .
        run: |
          pnpm --filter @immich/sdk --filter @immich/cli install --frozen-lockfile
          pnpm --filter @immich/sdk --filter @immich/cli build
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Start the stack
        run: docker compose up -d --build --renew-anon-volumes --force-recreate --remove-orphans --wait --wait-timeout 300
      - name: Run the API suite
        run: pnpm test
      - name: Run the maintenance suite
        run: pnpm test:maintenance
      # Without these the only evidence of a failed run is a vitest timeout, and the cause is almost
      # always in the server's log rather than the test's.
      - name: Capture the stack logs
        if: always()
        run: docker compose logs --no-color > docker-compose-logs.txt
      - name: Archive the stack logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-api-docker-logs
          path: ./e2e/docker-compose-logs.txt
          retention-days: 7

  # Coverage that used to arrive free from upstream's test.yml and left with it when that workflow was
  # disabled. Not academic: e2e imports @immich/cli as a workspace package and the API suite builds it,
  # so a broken CLI already fails E2E (API) -- ten minutes later and wearing a different job's name.
  #
  # Ungated. It is ~2 minutes, and putting it behind `changes` would cost it a `needs` barrier for no
  # real saving.
  #
  # The other two things test.yml covered and this does not: packages/scripts (upstream's release
  # tooling, which this fork does not use -- it releases through fork-release-mobile.yml) and
  # machine-learning. ML is deliberate and checked rather than assumed: docker-compose.yml here runs
  # ghcr.io/immich-app/immich-machine-learning, upstream's published image. The fork builds only the
  # server image, so nothing it does can break ML and nothing ML does needs gating here.
  cli:
    name: CLI (unit, lint, format, check)
    if: >-
      ${{ github.repository != 'immich-app/immich'
          && !(github.event_name == 'pull_request'
               && github.event.pull_request.user.login == 'github-actions[bot]'
               && startsWith(github.head_ref, 'sync/upstream-')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./packages/cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/fork-setup
      - run: mise run ci-unit

  # The browser half of e2e, which nothing here has ever run. fork-ci.yml's header used to say the
  # Playwright projects were left out because "the fork has touched only their fixtures so far". That
  # stopped being true the moment this fork started changing web behaviour -- and `src/specs/web/
  # asset-viewer` and `src/ui/specs/asset-viewer` are precisely where a change to the asset viewer
  # would show up.
  #
  # A separate job from E2E (API) rather than three more steps in it, even though that means standing
  # the compose stack up twice. Runner minutes are free on a public repository and the two run in
  # parallel, so this costs wall clock only if it becomes the longest job -- and in exchange a
  # Playwright flake stays legible as a Playwright flake instead of turning the API suite red.
  #
  # `--only-shell` for chromium: the headless shell is a fraction of the full browser download and is
  # what the config's Desktop Chrome project actually runs.
  e2e-web:
    name: E2E (web, Playwright)
    needs: changes
    if: >-
      ${{ github.repository != 'immich-app/immich'
          && !(github.event_name == 'pull_request'
               && github.event.pull_request.user.login == 'github-actions[bot]'
               && startsWith(github.head_ref, 'sync/upstream-'))
          && needs.changes.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
          submodules: recursive
      - uses: ./.github/actions/fork-setup
      - name: Set up the SDK and CLI
        working-directory: .
        run: |
          pnpm --filter @immich/sdk --filter @immich/cli install --frozen-lockfile
          pnpm --filter @immich/sdk --filter @immich/cli build
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install the Chromium headless shell
        run: pnpm exec playwright install chromium --only-shell
      - name: Start the stack
        run: docker compose up -d --build --renew-anon-volumes --force-recreate --remove-orphans --wait --wait-timeout 300
      - name: Run the web suite
        run: pnpm test:web
      - name: Run the ui suite
        run: pnpm test:web:ui
      - name: Run the web maintenance suite
        run: pnpm test:web:maintenance
      # The Playwright report is the only thing that makes a failed browser test diagnosable after the
      # fact -- it carries the trace, the screenshot and the DOM at the point of failure.
      - name: Capture the stack logs
        if: always()
        run: docker compose logs --no-color > docker-compose-logs.txt
      - name: Archive the report and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-web-report
          path: |
            ./e2e/playwright-report
            ./e2e/test-results
            ./e2e/docker-compose-logs.txt
          retention-days: 7

  # The generated SQL in server/src/queries is committed, and nothing gated it until now. It went
  # stale for real: album.hiddenFrom was added to SyncRepository and the fixture was never
  # regenerated, unnoticed from b10bd6029 until a manual `immich-ci sql` run days later. Upstream has
  # this check (sql-schema-up-to-date in test.yml); that workflow only runs on push to main, so the
  # fork never inherited it.
  #
  # Two things are verified, in the order upstream verifies them: the committed migrations still
  # build the schema the tables describe, and the generated SQL still matches the repositories.
  # `mise //:sql` reads server/dist rather than src, so the build above it is load-bearing -- against
  # a stale dist this passes while proving nothing.
  sql:
    name: SQL (generated queries are current)
    if: >-
      ${{ github.repository != 'immich-app/immich'
          && !(github.event_name == 'pull_request'
               && github.event.pull_request.user.login == 'github-actions[bot]'
               && startsWith(github.head_ref, 'sync/upstream-')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        # Digest-pinned to the same image upstream's check uses, and the same tag the medium suite
        # asks Testcontainers for.
        image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3@sha256:dbf18b3ffea4a81434c65b71e20d27203baf903a0275f4341e4c16dfd901fd67
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: immich
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DB_URL: postgres://postgres:postgres@localhost:5432/immich
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/fork-setup
      - run: pnpm install --frozen-lockfile
      - name: Build plugins
        run: mise //:plugins
      - name: Build the server
        run: mise //server:build
      - name: Run migrations
        run: pnpm --filter immich migrations:run
      - name: Regenerate the SQL
        run: mise //:sql
      - name: Verify the generated SQL is unchanged
        run: |
          if git diff --quiet -- server/src/queries; then
            echo "generated SQL is current"
            exit 0
          fi
          echo "::error::server/src/queries is stale. Run 'immich-ci sql' (or 'mise //:sql') and commit the result."
          git diff --stat -- server/src/queries
          git diff -- server/src/queries | head -300
          exit 1

  asset-surfaces:
    name: Asset surfaces (new read paths are classified)
    if: >-
      ${{ github.repository != 'immich-app/immich'
          && !(github.event_name == 'pull_request'
               && github.event.pull_request.user.login == 'github-actions[bot]'
               && startsWith(github.head_ref, 'sync/upstream-')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Empty for push and pull_request, so checkout keeps its default behaviour there.
          ref: ${{ inputs.ref }}
      # Deliberately not gated behind a regeneration: it reads the committed spec, which the openapi
      # job already proves is current, so this stays a seconds-long job rather than a 20 minute one.
      #
      # This is the gate for the failure mode neither a conflict nor a compile error catches: upstream
      # adding an endpoint that returns assets. The visibility matrix only knows the endpoints it was
      # told about, so a new read path silently bypasses the whole policy. Node only, no install.
      - name: Check for unclassified asset-bearing operations
        run: node _fork/asset-surfaces.mjs check

  # Behind the same filter as `Mobile (build)`, on identical inputs. This job is 7 minutes and ran on
  # every push, web-only ones included; 12 of the last 20 commits here touched no mobile file. The
  # header's rule -- a filter that wrongly skips a gate is worse than one that wrongly runs it -- is
  # why this extends only to mobile, where the same filter is already trusted for the more expensive
  # job. The 1-3 minute server and web gates stay ungated; the saving would not pay for the risk.
  mobile:
    name: Mobile (analyze, format, test)
    needs: changes
    if: >-
      ${{ github.repository != 'immich-app/immich'
          && !(github.event_name == 'pull_request'
               && github.event.pull_request.user.login == 'github-actions[bot]'
               && startsWith(github.head_ref, 'sync/upstream-'))
          && needs.changes.outputs.mobile == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Empty for push and pull_request, so checkout keeps its default behaviour there.
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/fork-setup
      # install:ci is install with --enforce-lockfile. It depends on //:open-api-dart, so the
      # generated client is produced here rather than being committed (gitignored since #30287).
      # Its install:ios step is a no-op off macOS, so this is safe on a Linux runner.
      - run: mise run install:ci
      # The steps of `checklist`, spelled out, minus DCM.
      #
      # `mise run checklist` cannot be used here: it calls `analyze`, which is analyze:dart plus
      # analyze:dcm, and `dcm analyze` on a CI server needs a paid licence key (DCM_CI_KEY). Without
      # one it prints its usage and exits 64. Upstream does not run DCM in CI either - no step and no
      # such secret anywhere in their workflows - so DCM stays a local-only gate here, matching them.
      # `mise run //mobile:analyze` locally still covers it.
      #
      # Codegen must run before analysis. Skipping it produces thousands of phantom analyzer errors,
      # and the drift schema in particular is not part of checklist while the migration tests need it.
      - run: mise run codegen:pigeon
      - run: mise run codegen:dart
      - run: mise run codegen:translation
      - run: mise run codegen:drift:schema
      - run: mise run analyze:dart
      # dart format with --set-exit-if-changed, so this is a real gate rather than a rewrite.
      - run: mise run format
      - run: mise run test

  # The only job that compiles the app. Everything in `mobile` above runs on the Dart VM, so Gradle,
  # R8, manifest merging, plugin registration and the NDK are all unexercised by it -- a broken
  # AndroidManifest passes `analyze` and the full test suite without a murmur. Before this job existed
  # the first thing to compile the app was fork-release-mobile.yml, on a tag push, which meant finding
  # a build break against a tag: the worst possible moment.
  #
  # --release, not --debug, and that is the point of running it here rather than only locally.
  # `immich-ci mobile:apk` builds debug because it has to be fast enough to sit in the local gate
  # (~30s warm); debug skips R8, so shrinker and obfuscation failures survive it. This is ~4.5 minutes
  # and catches them, in parallel with the other jobs.
  #
  # No keystore, deliberately. `mobile/android/app/build.gradle` falls back to debug signing when
  # android/key.jks is absent (`hasKeystore`), which is exactly right for a compile check and exactly
  # wrong for anything installable -- so nothing here is uploaded. Releasable APKs come from
  # fork-release-mobile.yml, which fails loudly if KEY_JKS is missing rather than debug-signing.
  mobile-build:
    name: Mobile (build)
    needs: changes
    if: >-
      ${{ github.repository != 'immich-app/immich'
          && !(github.event_name == 'pull_request'
               && github.event.pull_request.user.login == 'github-actions[bot]'
               && startsWith(github.head_ref, 'sync/upstream-'))
          && needs.changes.outputs.mobile == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: ''
      # The public mise action, not immich-app/devtools/actions/use-mise: that one needs a token from
      # an app this fork does not have. Same substitution the rest of this file makes.
      - uses: ./.github/actions/fork-setup
        with:
          working-directory: ./mobile
      # Gradle dominates this job: the same build is ~4.5 min locally against a warm cache and was
      # over 10 on a cold runner. mise-action already caches the toolchain (Flutter, Java) on its own,
      # and pub and Gradle are what remain. Keyed on the lockfiles that decide the contents, with a
      # prefix-only restore key so a dependency bump warms from the previous cache instead of starting
      # from nothing.
      - name: Cache pub packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Install dependencies
        run: mise //mobile:install:ci
      - name: Perform codegen
        run: mise //mobile:codegen
      # mobile/android/gradle.properties asks for a 4G daemon, and the release build does not fit in
      # it on a hosted runner: JetifyTransform rewrites Flutter's native jars during
      # mergeReleaseNativeLibs and dies with "Java heap space". It is marginal rather than absolute --
      # the same `flutter build apk --release` passes in Fork CI's Mobile (build) job -- which is
      # worse than a hard failure, because it turns a release into a coin flip.
      #
      # Raised here rather than in the project file, which is upstream's: GRADLE_USER_HOME's
      # gradle.properties wins over the project's, the same mechanism the android CI container uses
      # to cap its daemon. Runners have 16G, so 8G leaves ample room for the workers.
      - name: Give Gradle enough heap for the release build
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g' >> ~/.gradle/gradle.properties
      - name: Build the APK
        working-directory: ./mobile
        run: flutter build apk --release

  upstream-drift:
    name: Upstream drift (informational)
    if: >-
      ${{ github.repository != 'immich-app/immich'
          && !(github.event_name == 'pull_request'
               && github.event.pull_request.user.login == 'github-actions[bot]'
               && startsWith(github.head_ref, 'sync/upstream-')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Empty for push and pull_request, so checkout keeps its default behaviour there.
          ref: ${{ inputs.ref }}
          # merge-base needs real history; on a shallow clone it exits non-zero.
          fetch-depth: 0
      - name: Report divergence and staleness separately
        run: |
          set -euo pipefail
          if ! git remote get-url upstream > /dev/null 2>&1; then
            git remote add upstream https://github.com/immich-app/immich.git
          fi
          git fetch -q upstream main
          # Measured from the merge-base, never from upstream HEAD: diffing against a moving HEAD
          # counts upstream's own progress as our divergence, which is a false alarm. Two numbers,
          # because they mean different things and have different fixes.
          base=$(git merge-base HEAD upstream/main 2>/dev/null || true)
          if [ -z "$base" ]; then
            echo "::notice ::No merge-base with upstream/main (shallow clone?) - skipping drift report."
            exit 0
          fi
          ours=$(git rev-list --count "$base"..HEAD)
          behind=$(git rev-list --count HEAD..upstream/main)
          echo "fork commits since the merge-base: $ours"
          echo "upstream commits not yet merged here: $behind"
          if [ "$behind" -gt 200 ]; then
            echo "::warning ::$behind upstream commits behind. Conflict cost grows faster than linearly with drift; sync sooner."
          elif [ "$behind" -gt 0 ]; then
            echo "::notice ::$behind upstream commits not yet merged."
          fi

  # The one check to require on `integration`. Requiring the individual jobs cannot work: the
  # `changes` filter legitimately skips `Mobile (build)`, `Mobile (analyze, format, test)` and
  # `E2E (API)`, and a required check that never reports leaves the PR blocked forever.
  #
  # `always()` is the point -- it has to run precisely when something upstream of it failed. Skipped
  # passes, failure and cancelled do not. `needs` must list every gate; a job left out of it is a job
  # whose failure this check would call green, which is the one bug this file cannot afford.
  complete:
    name: Fork CI complete
    needs:
      - changes
      - workflows
      - server
      - server-medium
      - web
      - web-lint
      - i18n
      - openapi
      - e2e-check
      - e2e-api
      - e2e-web
      - cli
      - sql
      - asset-surfaces
      - mobile
      - mobile-build
      - upstream-drift
    if: >-
      ${{ always()
          && github.repository != 'immich-app/immich'
          && !(github.event_name == 'pull_request'
               && github.event.pull_request.user.login == 'github-actions[bot]'
               && startsWith(github.head_ref, 'sync/upstream-')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any gate did not pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' | sort

          # Into the run summary as well as the log. The summary is what is visible from the PR and
          # from `gh run view` without drilling into a job, and "which gate was skipped" is the
          # question this suite gets asked most, now that three of them sit behind a filter.
          {
            echo "| result | gate |"
            echo "| --- | --- |"
            echo "$RESULTS" | jq -r 'to_entries | sort_by(.key)[] | "| \(.value.result) | \(.key) |"'
          } >> "$GITHUB_STEP_SUMMARY"

          bad=$(echo "$RESULTS" | jq -r '
            [to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key]
            | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error::gates did not pass: $bad"
            exit 1
          fi
          echo "every gate passed or was skipped"
