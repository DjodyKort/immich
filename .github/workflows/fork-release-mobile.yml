# [FORK] Build a signed Android APK and publish it as a release on this fork.
#
# Why this exists rather than reusing upstream's `build-mobile.yml`: that workflow is a
# `workflow_call` with twelve `required: true` secrets, including iOS certificates, App Store Connect
# keys and Fastlane team ids. A fork that only wants an Android APK cannot satisfy them, and GitHub
# refuses the call outright when a required secret is missing. This is the Android half, standalone.
#
# It exists to feed Obtainium: point Obtainium at this repository and it tracks these releases,
# picking the APK for your device's ABI.
#
# Per-ABI APKs only, no universal one. Building the universal APK meant a second full compile, link,
# R8 and native-lib merge of the same code -- it was roughly half the job's wall clock for an artifact
# Obtainium never picks, because Obtainium matches the ABI itself. Sideloading by hand needs the right
# file: arm64-v8a for any phone made in the last decade.
#
# ## Before the first run
#
# Set these four repository secrets, generated from a keystore you create once:
#
#   KEY_JKS                 the keystore, base64 encoded (`base64 -w0 key.jks`)
#   ALIAS                   the key alias inside it
#   ANDROID_KEY_PASSWORD    the key password
#   ANDROID_STORE_PASSWORD  the keystore password
#
# **Back that keystore up somewhere you trust, and never rotate it.** Android refuses to install an
# update signed by a different key than the installed app, so losing it means every future release
# fails to install and each user has to uninstall and lose their local state. For the same reason,
# moving from the official Immich app to these builds needs one uninstall first: the signatures
# differ, and no amount of version bumping gets around that.
#
# ## Releasing
#
# Tag a commit and push the tag:
#
#   git tag v3.1.0-fork.3 && git push origin v3.1.0-fork.3
#
# The tag pattern matches the image tags this fork already uses. Obtainium compares release tags, so
# the fork counter has to keep going up.

name: '[FORK] Release mobile APK'

on:
  push:
    tags:
      - 'v*-fork.*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create the release as a draft'
        required: false
        default: false
        type: boolean

# Never cancel-in-progress: a half-built release that has already created the GitHub release but not
# yet attached every APK is worse than a slow one, and `gh release create` is not idempotent.
concurrency:
  group: fork-release-mobile-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  android:
    name: Build, sign and release the Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release and attach the APKs
    steps:
      # `github.ref_name` is the *branch* on a workflow_dispatch, so dispatching this from
      # `integration` publishes a release literally called "integration" and burns that name -- a
      # release cannot be renamed, only deleted. Releases come from tags; a dispatch is for re-running
      # a tag whose build failed. First step on purpose: this costs five seconds, and finding it after
      # the build costs fifteen minutes.
      - name: Refuse to release anything that is not a tag
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "::error::Refusing to publish a release named '$REF_NAME'. Dispatch this workflow from" \
               "a tag (Run workflow -> pick a tag), not from a branch." && exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Gradle falls back to *debug* signing when `android/key.jks` is missing or empty
      # (mobile/android/app/build.gradle, `hasKeystore`). A debug-signed APK installs happily once and
      # then can never be updated by a properly signed one, so a missing secret has to stop the run
      # here rather than produce a release that poisons everyone who installs it.
      - name: Create and verify the keystore
        env:
          KEY_JKS: ${{ secrets.KEY_JKS }}
        working-directory: ./mobile
        run: |
          if [ -z "$KEY_JKS" ]; then
            echo "::error::KEY_JKS is not set. Without it Gradle would silently debug-sign the APK," \
                 "which can never be updated. See the header of this workflow." && exit 1
          fi
          printf "%s" "$KEY_JKS" | base64 -d > android/key.jks
          if [ ! -s android/key.jks ]; then
            echo "::error::key.jks decoded to an empty file - check that KEY_JKS is valid base64." && exit 1
          fi

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: ''

      - uses: ./.github/actions/fork-setup
        with:
          working-directory: ./mobile

      # The release used to be the one mobile build in this fork with no cache at all, which is why it
      # took 15 minutes for the same work Fork CI's Mobile (build) does in 6. Same keys as fork-ci.yml
      # on purpose: `integration` is this fork's default branch, and GitHub lets any ref restore caches
      # saved on the default branch, so a tag build inherits whatever the last push to `integration`
      # warmed up. Different keys would have meant two caches and no sharing.
      # zizmor flags both caches here as cache-poisoning: a workflow that publishes a signed artifact
      # is restoring a cache that a push to the default branch can write. That is a real description
      # of the mechanism -- the comment above says so in as many words -- and it is accepted rather
      # than missed. Only the repository owner can push to `integration`, and dropping the cache costs
      # this job nine of its fifteen minutes. Revisit the moment anyone else gets push access.
      - name: Cache pub packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning]
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning]
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: mise //mobile:install:ci

      - name: Perform codegen
        run: mise //mobile:codegen

      # versionCode comes from the run number rather than pubspec's build number, which only moves
      # when upstream bumps it - two fork releases off one upstream version would otherwise carry the
      # same versionCode. Run numbers only ever increase, which is all Android and Obtainium need.
      # mobile/android/gradle.properties asks for a 4G daemon, and the release build does not fit in
      # it on a hosted runner: JetifyTransform rewrites Flutter's native jars during
      # mergeReleaseNativeLibs and dies with "Java heap space". It is marginal rather than absolute --
      # the same `flutter build apk --release` passes in Fork CI's Mobile (build) job -- which is
      # worse than a hard failure, because it turns a release into a coin flip.
      #
      # Raised here rather than in the project file, which is upstream's: GRADLE_USER_HOME's
      # gradle.properties wins over the project's, the same mechanism the android CI container uses
      # to cap its daemon. Runners have 16G, so 8G leaves ample room for the workers.
      - name: Give Gradle enough heap for the release build
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g' >> ~/.gradle/gradle.properties
      - name: Build the APKs
        working-directory: ./mobile
        env:
          ALIAS: ${{ secrets.ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          flutter build apk --release --build-number=${{ github.run_number }} \
            --split-per-abi --target-platform android-arm,android-arm64,android-x64

      - name: Confirm the APKs are not debug-signed
        working-directory: ./mobile/build/app/outputs/flutter-apk
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          for apk in *.apk; do
            if "$APKSIGNER" verify --print-certs "$apk" | grep -q "CN=Android Debug"; then
              echo "::error::$apk is debug-signed and would be uninstallable-to-update." && exit 1
            fi
            echo "$apk: release-signed"
          done

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          DRAFT: ${{ inputs.draft && '--draft' || '' }}
        working-directory: ./mobile/build/app/outputs/flutter-apk
        run: |
          set -euo pipefail
          # An array rather than an unquoted "$DRAFT". Unquoted it is a word-splitting bug waiting for
          # the day someone puts two flags in it; quoted it passes an empty argument on a normal tag
          # push, which gh rejects. This is the shape that is right in both cases.
          args=(--repo "$REPO" --title "$TAG" --generate-notes)
          [ -n "$DRAFT" ] && args+=("$DRAFT")
          gh release create "$TAG" "${args[@]}" \
            app-arm64-v8a-release.apk \
            app-armeabi-v7a-release.apk \
            app-x86_64-release.apk
