# [FORK] Weekly merge of upstream/main into integration, gated and turned into a PR.
#
# Tier 1 of the design in _docs/fork-sync-and-versioning.md: no model in the loop. Most weeks the
# merge is either clean or resolvable from recorded rerere resolutions, and paying an LLM to run a
# clean `git merge` would be waste. Conflicts that rerere cannot replay are reported as an issue
# instead, which is where tier 2 will later hook in.
#
# Weekly rather than per-release on purpose. Upstream runs 44 to 76 commits a week and releases every
# one to three weeks, and conflict cost grows faster than linearly with drift: four days of drift, 30
# commits, produced eight conflicts and one break that produced no conflict at all.
#
# Success is the gate suite, never the merge exit code. That same break, upstream deleting
# remoteAssetRepositoryProvider from under a file of ours, conflicted with nothing.

name: Upstream sync

on:
  schedule:
    # Sundays 05:17 UTC. Deliberately off the :00 mark, which is where every scheduled job piles up.
    - cron: '17 5 * * 0'
  workflow_dispatch:

concurrency:
  group: upstream-sync
  # Not cancel-in-progress: killing a run halfway through a merge and push leaves a partial branch.
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  # Needed because this workflow calls fork-ci.yml, whose medium job logs in to ghcr.io. A called
  # workflow cannot request a permission the caller does not hold, and the mismatch fails the run at
  # startup with only "likely a workflow file issue" to go on.
  packages: read

jobs:
  merge:
    name: Merge upstream
    if: ${{ github.repository != 'immich-app/immich' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      status: ${{ steps.merge.outputs.status }}
      branch: ${{ steps.merge.outputs.branch }}
      behind: ${{ steps.drift.outputs.behind }}
      base: ${{ steps.drift.outputs.base }}
      replayed: ${{ steps.merge.outputs.replayed }}
      conflicts: ${{ steps.merge.outputs.conflicts }}
      blocked_files: ${{ steps.merge.outputs.blocked_files }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Credentials are kept here, unlike the gate workflow, because this job pushes a branch.
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream and measure drift
        id: drift
        run: |
          set -euo pipefail
          git remote get-url upstream >/dev/null 2>&1 || \
            git remote add upstream https://github.com/immich-app/immich.git
          git fetch -q upstream main
          behind=$(git rev-list --count HEAD..upstream/main)
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          echo "upstream commits not yet merged: $behind"

          # Captured here, before the merge, because afterwards it is unrecoverable: once upstream/main
          # is an ancestor of the sync branch, merge-base(HEAD, upstream/main) is upstream/main itself
          # and the triage range collapses to empty. This is the range that answers "what arrived".
          base=$(git merge-base HEAD upstream/main)
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "triage base: $base"

      - name: Merge, replaying recorded resolutions
        id: merge
        env:
          # Optional. Needed only to push a merge that touches .github/workflows, which GITHUB_TOKEN is
          # not allowed to do. Contents: write and Workflows: write, scoped to this repo.
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -uo pipefail
          if [ "${{ steps.drift.outputs.behind }}" = "0" ]; then
            echo "already up to date"
            echo "status=uptodate" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The upstream sha is in the name, not just the date: two runs on one day would otherwise
          # collide on the same branch from different bases, and the second push would be rejected as a
          # non-fast-forward. Naming it after the upstream state also makes a re-run idempotent.
          branch="sync/upstream-$(date -u +%Y-%m-%d)-$(git rev-parse --short upstream/main)"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git switch -c "$branch"
          pre_merge=$(git rev-parse HEAD)

          # rerere replays the resolutions this fork has already made. The cache is tracked in the
          # repo because $GIT_DIR/rr-cache does not survive a fresh clone; see _fork/rr-cache.sh.
          # Invoked through bash so a missing exec bit cannot break it.
          git config rerere.enabled true
          git config rerere.autoupdate true
          bash ./_fork/rr-cache.sh import

          git merge --no-edit upstream/main > merge.log 2>&1 || true
          cat merge.log

          replayed=$(grep -oE "Resolved '[^']+'" merge.log | sed "s/Resolved '//; s/'$//" | paste -sd, - || true)
          conflicts=$(git diff --name-only --diff-filter=U | paste -sd, - || true)
          echo "replayed=$replayed" >> "$GITHUB_OUTPUT"
          echo "conflicts=$conflicts" >> "$GITHUB_OUTPUT"

          if [ -n "$conflicts" ]; then
            # Nothing useful to push: a branch cannot carry an unresolved merge. Reported as an issue.
            echo "::warning ::Unresolved conflicts: $conflicts"
            echo "status=conflicted" >> "$GITHUB_OUTPUT"
            git merge --abort || true
            exit 0
          fi

          # A clean merge commits itself. One that conflicted and was fully resolved by rerere does
          # not, because rerere.autoupdate stages the resolution without completing the merge.
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit --no-edit
          fi

          # Any resolution rerere learned during this run is worth keeping, but this job cannot commit
          # to the cache safely from CI, so it is surfaced rather than written.
          bash ./_fork/rr-cache.sh export >/dev/null || true
          if ! git diff --quiet -- _fork/rr-cache; then
            echo "::notice ::rerere learned something new this run. Run _fork/rr-cache.sh export locally and commit it."
          fi
          git checkout -- _fork/rr-cache 2>/dev/null || true

          # GITHUB_TOKEN cannot push a change under .github/workflows: the remote rejects it with
          # "refusing to allow a GitHub App to create or update workflow ... without `workflows`
          # permission", and there is no `workflows` permission a workflow can grant itself, so no
          # permissions block fixes it. Upstream edits its workflows often, so this is the common case
          # rather than an edge one. A PAT or app token with Workflows: write is the only way through.
          workflow_changes=$(git diff --name-only "$pre_merge"..HEAD -- .github/workflows | head -20)
          if [ -n "$workflow_changes" ] && [ -z "${SYNC_TOKEN:-}" ]; then
            echo "::error ::This merge changes .github/workflows, which GITHUB_TOKEN may not push. Add a SYNC_TOKEN secret with Contents: write and Workflows: write."
            echo "files:"
            echo "$workflow_changes"
            echo "status=blocked" >> "$GITHUB_OUTPUT"
            echo "blocked_files=$(echo "$workflow_changes" | paste -sd, -)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Pushing as SYNC_TOKEN takes more than putting it in the URL, and this took three attempts to
          # get right, so the reasoning is worth keeping:
          #
          # 1. A token in the URL loses. actions/checkout leaves an Authorization header configured, and a
          #    header beats userinfo, so the push still goes out as the job's GitHub App and is refused
          #    for workflow files - with a message that looks like the secret was never read.
          # 2. Unsetting `http.https://github.com/.extraheader` does not find it either. checkout@v6
          #    stores credentials in a separate file wired in through `includeIf`, so there is no
          #    extraheader key in the local config to remove.
          # 3. What does work is overriding the header on the command line, which outranks any config
          #    file. The App credential stays intact for the no-token path, where it is the only one
          #    available and is sufficient for anything outside .github/workflows.
          if [ -n "${SYNC_TOKEN:-}" ]; then
            auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$SYNC_TOKEN" | base64 -w0)"
            push() { git -c http.https://github.com/.extraheader="$auth_header" push "$@"; }
          else
            push() { git push "$@"; }
          fi

          # The branch may already exist from an earlier run at this same upstream sha, with a different
          # history, because integration moved in between. A plain push is then rejected as a
          # non-fast-forward and the whole sync fails for a reason unrelated to the merge.
          #
          # This branch is owned solely by this workflow and is disposable, so replacing it is correct.
          # --force-with-lease rather than --force, anchored to the state observed a moment ago, so a
          # branch someone else advanced in the meantime is refused instead of clobbered.
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch -q origin "$branch"
            remote_sha=$(git rev-parse FETCH_HEAD)
            echo "branch exists remotely at $remote_sha; replacing it"
            push --force-with-lease="refs/heads/$branch:$remote_sha" origin "$branch"
          else
            push origin "$branch"
          fi
          echo "status=merged" >> "$GITHUB_OUTPUT"

  gates:
    name: Gates
    needs: merge
    if: ${{ github.repository != 'immich-app/immich' && needs.merge.outputs.status == 'merged' }}
    # The same gate suite the branch would get from a pull_request event. Called explicitly because a
    # push made with GITHUB_TOKEN does not trigger workflows.
    uses: ./.github/workflows/fork-ci.yml
    with:
      ref: ${{ needs.merge.outputs.branch }}

  pull-request:
    name: Open the pull request
    needs: [merge, gates]
    if: ${{ always() && github.repository != 'immich-app/immich' && needs.merge.outputs.status == 'merged' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      number: ${{ steps.pr.outputs.number }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ needs.merge.outputs.branch }}
      BEHIND: ${{ needs.merge.outputs.behind }}
      REPLAYED: ${{ needs.merge.outputs.replayed }}
      GATES: ${{ needs.gates.result }}
    steps:
      # gh pr create --label hard-fails on a label that does not exist yet, which is easy to hit on a
      # fresh fork. --force updates an existing label rather than erroring.
      - name: Ensure labels exist
        run: |
          gh label create sync --color 1D76DB --description "Upstream sync" --force
          gh label create automation --color 0E8A16 --description "Opened by an automated workflow" --force

      - name: Create or update the pull request
        id: pr
        run: |
          set -euo pipefail

          if [ "$GATES" = "success" ]; then
            gates_line="All gates passed."
            draft=""
          else
            gates_line="Gates finished as **$GATES**. Opened as a draft; do not merge until they are green."
            draft="--draft"
          fi

          {
            echo "Merges \`upstream/main\` into \`integration\`. Opened by \`upstream-sync.yml\`."
            echo
            echo "- Upstream commits merged: **$BEHIND**"
            echo "- $gates_line"
            echo
            if [ -n "$REPLAYED" ]; then
              echo "rerere replayed a recorded resolution for these files. A matching conflict hunk does"
              echo "not guarantee the right answer once the surrounding code has moved, so read these"
              echo "before merging:"
              echo
              echo "$REPLAYED" | tr ',' '\n' | sed 's/^/- /'
            else
              echo "No conflicts: the merge was clean."
            fi
            echo
            echo "A clean merge is not evidence of a working one. Upstream changes that touch none of our"
            echo "files can still break them, so the gate suite is the thing to trust here, not the"
            echo "absence of conflicts."
          } > body.md

          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body-file body.md
            echo "updated PR #$existing"
            number="$existing"
          else
            gh pr create \
              --base integration \
              --head "$BRANCH" \
              --title "chore: sync upstream/main ($BEHIND commits)" \
              --body-file body.md \
              --label sync \
              --label automation \
              $draft
            # Read it back rather than parsing the create output: the URL format is not a contract, and
            # the triage job needs a number it can comment on.
            number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

  triage:
    name: Triage what arrived
    needs: [merge, pull-request]
    # Runs whenever something merged, even if the PR step failed. The triage is worth having on its own,
    # and tying it to PR creation would mean a repo setting that blocks `gh pr create` also silently
    # costs us the review. Without a PR number it falls back to an artifact, below.
    if: ${{ always() && github.repository != 'immich-app/immich' && needs.merge.outputs.status == 'merged' }}
    # Tier 2. The deterministic half of this runs regardless of whether a model is reachable, so a
    # refused quota or an off server costs the comment its review section, not the whole comment.
    #
    # The range is pinned to the base the merge job captured *before* merging. Recomputing it here would
    # yield nothing: upstream/main is an ancestor of the sync branch by now, so the merge-base is
    # upstream/main itself and the range is empty. That failure would be silent and would look like a
    # clean report.
    uses: DjodyKort/argus/.github/workflows/task.yml@main
    with:
      task: merge-triage
      rules: _fork/argus-rules.json
      config: _fork/argus.config.json
      base: ${{ needs.merge.outputs.base }}
      head: upstream/main
      upstream_remote: https://github.com/immich-app/immich.git
      sink: ${{ needs.pull-request.outputs.number != '' && 'pr-comment' || 'artifact' }}
      pr_number: ${{ needs.pull-request.outputs.number }}
    secrets: inherit

  report-blocked:
    name: Report a push blocked by workflow permissions
    needs: merge
    if: ${{ github.repository != 'immich-app/immich' && needs.merge.outputs.status == 'blocked' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BEHIND: ${{ needs.merge.outputs.behind }}
      FILES: ${{ needs.merge.outputs.blocked_files }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # Reported in the run summary rather than as an issue: this repository has issues disabled, which
      # is normal for a contribution fork, and `gh issue create` simply fails there. The job also fails
      # on purpose, because with no issue tracker a green run is a report nobody sees.
      - name: Explain what is blocked
        run: |
          set -euo pipefail
          {
            echo "## Upstream sync blocked"
            echo
            echo "The merge itself was fine. The **push** was refused, because this sync changes files"
            echo "under \`.github/workflows\` and \`GITHUB_TOKEN\` is not permitted to create or update a"
            echo "workflow file. There is no \`workflows\` permission a workflow can grant itself, so this"
            echo "cannot be fixed with a \`permissions:\` block."
            echo
            echo "$BEHIND upstream commit(s) are waiting. Workflow files in this batch:"
            echo
            echo "$FILES" | tr ',' '\n' | sed 's/^/- /'
            echo
            echo "To unblock it, add a repository secret \`SYNC_TOKEN\`: a fine-grained PAT scoped to this"
            echo "repository with **Contents: write** and **Workflows: write**. The workflow picks it up"
            echo "automatically and pushes with it. Until then, this sync can be done by hand:"
            echo
            echo '```'
            echo 'git switch integration && git pull'
            echo 'git switch -c sync/upstream-$(date -u +%Y-%m-%d)'
            echo 'bash ./_fork/rr-cache.sh import'
            echo 'git merge upstream/main'
            echo '```'
            echo
            echo "Run: $RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error ::Upstream sync blocked: the merge touches .github/workflows and no SYNC_TOKEN secret is set. See the run summary."
          exit 1

  report-conflicts:
    name: Report unresolved conflicts
    needs: merge
    if: ${{ github.repository != 'immich-app/immich' && needs.merge.outputs.status == 'conflicted' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BEHIND: ${{ needs.merge.outputs.behind }}
      CONFLICTS: ${{ needs.merge.outputs.conflicts }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # Run summary rather than an issue, for the same reason as the blocked job: issues are disabled on
      # this fork, so `gh issue create` fails. Failing the job is what makes it visible.
      - name: Explain the conflicts
        run: |
          set -euo pipefail
          {
            echo "## Upstream sync needs manual conflict resolution"
            echo
            echo "\`upstream-sync.yml\` could not merge \`upstream/main\` without help. **$BEHIND** upstream"
            echo "commits are waiting. No branch was pushed, because a branch cannot carry an unresolved merge."
            echo
            echo "Conflicts rerere had no recorded resolution for:"
            echo
            echo "$CONFLICTS" | tr ',' '\n' | sed 's/^/- /'
            echo
            echo "To resolve locally, and teach rerere so the next sync replays it:"
            echo
            echo '```'
            echo 'git switch integration && git pull'
            echo 'git switch -c sync/upstream-$(date -u +%Y-%m-%d)'
            echo 'bash ./_fork/rr-cache.sh import'
            echo 'git merge upstream/main'
            echo '# resolve the conflicts, finish the merge, then:'
            echo 'bash ./_fork/rr-cache.sh export'
            echo 'git add _fork/rr-cache && git commit'
            echo '```'
            echo
            echo "Run: $RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error ::Upstream sync hit conflicts rerere could not replay. See the run summary."
          exit 1
